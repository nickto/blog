baseURL: https://blog.nickto.net/
locale: en-GB
title: Field notes
theme: PaperMod

DefaultContentLanguage: en
pagination:
  pagerSize: 10
enableRobotsTXT: true

permalinks:
  posts: /:year-:month-:day-:title/
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: true
    style: catppuccin-frappe
    tabWidth: 4
  # This enables using raw HTML in markdown
  goldmark:
    renderer:
      unsafe: true
params:
  homeInfoParams:
    Title: Notes on things I built or figured out
    Content: Small projects, experiments, and the occasional how-to, written down so I don't lose them.
  socialIcons: # optional
    - name: "gitlab"
      url: https://gitlab.com/nickto
    - name: "github"
      url: https://github.com/nickto
  ShowShareButtons: true
  comments: false
